name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        # PEP 735 dependency groups (the `dev` group pulls in the full runtime).
        run: |
          python -m pip install --upgrade pip
          pip install --group dev

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy (comm library)
        run: mypy custom_components/vaillant_gateway/vaillant_eebus

      - name: Tests
        run: pytest
